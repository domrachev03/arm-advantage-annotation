[project]
name = "arm-advantage-annotation"
version = "0.1.0"
description = "Paper-faithful ARM advantage annotation for LeRobot v3 datasets"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "huggingface-hub>=0.27,<2",
  "numpy>=2,<3",
  "pyarrow>=18,<26",
  "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
